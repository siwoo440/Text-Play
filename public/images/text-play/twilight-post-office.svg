<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">황혼 우체국 일러스트</title>
  <desc id="desc">노을 진 언덕 위의 시계탑 우체국과 하늘을 나는 봉인 편지</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset=".45" stop-color="#ffe2a3"/>
      <stop offset=".78" stop-color="#ffbb63"/>
      <stop offset="1" stop-color="#ff9640"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset=".55" stop-color="#ffe9a8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb45e"/>
      <stop offset="1" stop-color="#ff9f45"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a2e"/>
      <stop offset="1" stop-color="#f4731c"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2600f"/>
      <stop offset="1" stop-color="#c24d0a"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3a12"/>
      <stop offset="1" stop-color="#5e2509"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c9"/>
      <stop offset="1" stop-color="#ffcf55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="letter">
      <rect x="-34" y="-22" width="68" height="44" rx="6" fill="#ffffff"/>
      <path d="M-34 -18 L0 6 L34 -18" fill="none" stroke="#f3c48a" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="6" r="9" fill="#ff7a1a"/>
      <circle cx="0" cy="6" r="4" fill="#ffd166"/>
    </g>
  </defs>

  <rect width="1200" height="760" fill="url(#sky)"/>
  <circle cx="820" cy="300" r="250" fill="url(#sunGlow)"/>
  <circle cx="820" cy="300" r="118" fill="#fff4cf"/>
  <circle cx="820" cy="300" r="118" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="4"/>

  <g fill="#ffffff" fill-opacity=".72">
    <path d="M110 170c18-26 62-30 84-6 22-14 58-8 66 20 26 2 38 30 18 44H96c-26-8-20-50 14-58Z"/>
    <path d="M930 130c14-20 48-24 66-6 18-10 46-6 52 16 20 2 30 24 14 34H918c-20-6-16-38 12-44Z"/>
  </g>

  <g stroke="#9a4413" stroke-width="4" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M300 230q12-10 24 0q12-10 24 0"/>
    <path d="M356 262q9-8 18 0q9-8 18 0"/>
    <path d="M1010 250q10-9 20 0q10-9 20 0"/>
  </g>

  <path d="M0 520C160 450 300 470 430 500S720 430 880 450 1100 500 1200 470V760H0Z" fill="url(#hillFar)"/>
  <path d="M0 590C150 540 320 560 470 585S760 540 930 560 1120 600 1200 580V760H0Z" fill="url(#hillMid)"/>

  <g transform="translate(470 330)">
    <rect x="96" y="-70" width="88" height="250" rx="8" fill="url(#building)"/>
    <path d="M86 -70 L140 -132 L194 -70Z" fill="#6b2a0b"/>
    <circle cx="140" cy="-14" r="30" fill="#fff6dc" stroke="#ffcf55" stroke-width="6"/>
    <path d="M140 -14 V-34 M140 -14 L154 -6" stroke="#8a3a12" stroke-width="5" stroke-linecap="round"/>
    <rect x="0" y="60" width="290" height="160" rx="10" fill="url(#building)"/>
    <path d="M-14 66 L145 6 L304 66Z" fill="#6b2a0b"/>
    <rect x="26" y="96" width="46" height="58" rx="23" fill="url(#windowLight)"/>
    <rect x="218" y="96" width="46" height="58" rx="23" fill="url(#windowLight)"/>
    <rect x="118" y="120" width="54" height="100" rx="27" fill="#3d1605"/>
    <rect x="124" y="126" width="42" height="94" rx="21" fill="url(#windowLight)" opacity=".85"/>
    <rect x="110" y="70" width="70" height="20" rx="5" fill="#ffd166"/>
    <text x="145" y="85" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#7a2f0c">POST</text>
    <g transform="translate(-58 150)">
      <rect x="0" y="0" width="34" height="56" rx="8" fill="#ff7a1a"/>
      <rect x="6" y="12" width="22" height="5" rx="2" fill="#7a2f0c"/>
      <rect x="14" y="56" width="6" height="18" fill="#7a2f0c"/>
    </g>
  </g>

  <path d="M0 660C200 610 380 640 560 650S900 610 1200 640V760H0Z" fill="url(#hillNear)"/>
  <path d="M560 760C590 700 600 650 614 552" stroke="#ffd9a0" stroke-width="16" stroke-linecap="round" fill="none" opacity=".55"/>

  <g>
    <g transform="translate(250 380) rotate(-12)"><use href="#letter"/></g>
    <g transform="translate(400 300) rotate(8) scale(.8)"><use href="#letter"/></g>
    <g transform="translate(1000 400) rotate(-6) scale(1.1)"><use href="#letter"/></g>
    <g transform="translate(1080 280) rotate(14) scale(.7)"><use href="#letter"/></g>
    <g transform="translate(180 250) rotate(18) scale(.6)"><use href="#letter"/></g>
  </g>

  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".85">
    <path d="M270 360C330 300 360 300 392 296"/>
    <path d="M980 384C940 340 900 320 860 318"/>
  </g>

  <g fill="#fff8e1">
    <circle cx="160" cy="120" r="3"/>
    <circle cx="520" cy="90" r="2.5"/>
    <circle cx="680" cy="150" r="2"/>
    <circle cx="1090" cy="170" r="3"/>
    <circle cx="1140" cy="90" r="2"/>
  </g>
</svg>
