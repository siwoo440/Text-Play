<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description"> <!-- 장면 시작 -->
  <title id="title">달빛 기록관</title> <!-- 장면 제목 -->
  <desc id="description">초승달 아래 유리 기록 카드가 빛나는 기록관 장면</desc> <!-- 장면 설명 -->
  <defs><radialGradient id="moonGlow"><stop stop-color="#f7f0ff"/><stop offset="1" stop-color="#6865a8"/></radialGradient><linearGradient id="hall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17152d"/><stop offset="1" stop-color="#3b315c"/></linearGradient></defs> <!-- 장면 효과 -->
  <rect width="1200" height="720" fill="url(#hall)"/> <!-- 기록관 배경 -->
  <circle cx="880" cy="170" r="120" fill="url(#moonGlow)" opacity="0.92"/> <!-- 달빛 원형 -->
  <circle cx="930" cy="130" r="120" fill="#1f1a38"/> <!-- 초승달 그림자 -->
  <g fill="#dcd6ff" stroke="#ffffff" stroke-opacity="0.35"><rect x="180" y="130" width="95" height="145" rx="12"/><rect x="350" y="250" width="95" height="145" rx="12"/><rect x="590" y="115" width="95" height="145" rx="12"/><rect x="770" y="330" width="95" height="145" rx="12"/></g> <!-- 유리 기록 -->
  <path d="M0 590Q240 470 480 590T960 590T1440 590V720H0Z" fill="#0e0d1d" opacity="0.9"/> <!-- 기록관 바닥 -->
  <text x="70" y="650" fill="#f4f0ff" font-size="42" font-family="sans-serif" font-weight="700">달빛 기록관</text> <!-- 장면 이름 -->
</svg> <!-- 장면 종료 -->
