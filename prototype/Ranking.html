<!DOCTYPE html> <!-- 문서 형식 -->
<html lang="ko"> <!-- 한국어 문서 -->
<head> <!-- 문서 정보 -->
    <meta charset="UTF-8"> <!-- 문자 인코딩 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 반응형 화면 -->
    <title>MATE:VERSE 기간별 추천 순위</title> <!-- 문서 제목 -->
    <style> /* 화면 스타일 */
        :root /* 색상 기준 */
        { /* 기준 시작 */
            color-scheme: dark; /* 어두운 체계 */
            --background: #0b0c11; /* 전체 배경 */
            --surface: #14161f; /* 카드 배경 */
            --surface-soft: #1b1e29; /* 보조 배경 */
            --line: #2a2e3b; /* 경계 색상 */
            --text: #f4f5fb; /* 주요 글자 */
            --muted: #9298aa; /* 보조 글자 */
            --accent: #7c3aed; /* 강조 색상 */
            --accent-bright: #a78bfa; /* 밝은 강조 */
        } /* 기준 종료 */
        * /* 전체 요소 */
        { /* 전체 시작 */
            box-sizing: border-box; /* 크기 계산 */
        } /* 전체 종료 */
        body /* 본문 */
        { /* 본문 시작 */
            min-width: 320px; /* 최소 너비 */
            min-height: 100vh; /* 최소 높이 */
            margin: 0; /* 바깥 여백 제거 */
            background: radial-gradient(circle at 50% -20%, rgba(124, 58, 237, 0.24), transparent 34%), var(--background); /* 본문 배경 */
            color: var(--text); /* 본문 글자 */
            font-family: Pretendard, "Noto Sans KR", system-ui, sans-serif; /* 본문 글꼴 */
        } /* 본문 종료 */
        button, a /* 조작 요소 */
        { /* 조작 시작 */
            font: inherit; /* 글꼴 상속 */
        } /* 조작 종료 */
        .ranking-header /* 상단 영역 */
        { /* 상단 시작 */
            position: sticky; /* 상단 고정 */
            top: 0; /* 상단 위치 */
            z-index: 10; /* 상단 층 */
            display: grid; /* 격자 배치 */
            grid-template-columns: auto 1fr auto; /* 세 영역 배치 */
            min-height: 68px; /* 상단 높이 */
            padding: 0 clamp(16px, 4vw, 56px); /* 상단 여백 */
            align-items: center; /* 세로 중앙 */
            gap: 18px; /* 요소 간격 */
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); /* 상단 경계 */
            background: rgba(11, 12, 17, 0.9); /* 상단 배경 */
            backdrop-filter: blur(18px); /* 상단 흐림 */
        } /* 상단 종료 */
        .back-link /* 뒤로 링크 */
        { /* 뒤로 시작 */
            display: inline-flex; /* 내용 폭 */
            min-height: 40px; /* 링크 높이 */
            padding: 0 14px; /* 링크 여백 */
            align-items: center; /* 세로 중앙 */
            border: 1px solid var(--line); /* 링크 테두리 */
            border-radius: 12px; /* 링크 모서리 */
            color: var(--text); /* 링크 글자 */
            font-size: 13px; /* 링크 크기 */
            font-weight: 800; /* 링크 굵기 */
            text-decoration: none; /* 밑줄 제거 */
        } /* 뒤로 종료 */
        .brand /* 브랜드 */
        { /* 브랜드 시작 */
            justify-self: center; /* 중앙 배치 */
            font-weight: 950; /* 브랜드 굵기 */
            letter-spacing: -0.05em; /* 브랜드 간격 */
        } /* 브랜드 종료 */
        .count-badge /* 개수 표식 */
        { /* 표식 시작 */
            padding: 7px 10px; /* 표식 여백 */
            border-radius: 999px; /* 표식 모양 */
            background: rgba(124, 58, 237, 0.2); /* 표식 배경 */
            color: #ddd2ff; /* 표식 글자 */
            font-size: 12px; /* 표식 크기 */
            font-weight: 850; /* 표식 굵기 */
        } /* 표식 종료 */
        .ranking-main /* 주요 영역 */
        { /* 주요 시작 */
            width: min(1440px, 100%); /* 주요 너비 */
            margin: 0 auto; /* 중앙 배치 */
            padding: 46px clamp(16px, 4vw, 56px) 80px; /* 주요 여백 */
        } /* 주요 종료 */
        .intro /* 소개 영역 */
        { /* 소개 시작 */
            display: flex; /* 가로 배치 */
            margin-bottom: 26px; /* 아래 여백 */
            align-items: end; /* 아래 정렬 */
            justify-content: space-between; /* 양쪽 배치 */
            gap: 20px; /* 요소 간격 */
        } /* 소개 종료 */
        .intro-copy span /* 소개 표식 */
        { /* 표식 시작 */
            color: var(--accent-bright); /* 표식 글자 */
            font-size: 13px; /* 표식 크기 */
            font-weight: 850; /* 표식 굵기 */
        } /* 표식 종료 */
        .intro-copy h1 /* 소개 제목 */
        { /* 제목 시작 */
            margin: 8px 0 10px; /* 제목 여백 */
            font-size: clamp(30px, 5vw, 52px); /* 제목 크기 */
            letter-spacing: -0.06em; /* 제목 간격 */
        } /* 제목 종료 */
        .intro-copy p /* 소개 설명 */
        { /* 설명 시작 */
            margin: 0; /* 설명 여백 */
            color: var(--muted); /* 설명 글자 */
            line-height: 1.6; /* 설명 줄높이 */
        } /* 설명 종료 */
        .period-tabs /* 기간 탭 */
        { /* 탭 시작 */
            display: grid; /* 격자 배치 */
            grid-template-columns: repeat(3, minmax(0, 1fr)); /* 세 칸 배치 */
            width: min(100%, 500px); /* 탭 너비 */
            gap: 8px; /* 탭 간격 */
        } /* 탭 종료 */
        .period-tab /* 기간 링크 */
        { /* 링크 시작 */
            display: flex; /* 중앙 배치 */
            min-height: 46px; /* 링크 높이 */
            align-items: center; /* 세로 중앙 */
            justify-content: center; /* 가로 중앙 */
            border: 1px solid var(--line); /* 링크 테두리 */
            border-radius: 13px; /* 링크 모서리 */
            background: var(--surface); /* 링크 배경 */
            color: var(--muted); /* 링크 글자 */
            font-size: 13px; /* 링크 크기 */
            font-weight: 850; /* 링크 굵기 */
            text-decoration: none; /* 밑줄 제거 */
        } /* 링크 종료 */
        .period-tab.active /* 선택 기간 */
        { /* 선택 시작 */
            border-color: var(--accent); /* 선택 테두리 */
            background: var(--accent); /* 선택 배경 */
            color: white; /* 선택 글자 */
        } /* 선택 종료 */
        .ranking-grid /* 순위 목록 */
        { /* 목록 시작 */
            display: grid; /* 격자 배치 */
            grid-template-columns: repeat(4, minmax(0, 1fr)); /* 네 열 배치 */
            gap: 16px; /* 카드 간격 */
        } /* 목록 종료 */
        .ranking-card /* 순위 카드 */
        { /* 카드 시작 */
            min-width: 0; /* 축소 허용 */
            overflow: hidden; /* 넘침 제거 */
            border: 1px solid var(--line); /* 카드 테두리 */
            border-radius: 18px; /* 카드 모서리 */
            background: linear-gradient(145deg, var(--surface-soft), var(--surface)); /* 카드 배경 */
            transition: border-color 160ms ease, transform 160ms ease; /* 반응 전환 */
        } /* 카드 종료 */
        .ranking-card:hover /* 카드 올림 */
        { /* 올림 시작 */
            border-color: var(--accent-bright); /* 올림 테두리 */
            transform: translateY(-3px); /* 올림 이동 */
        } /* 올림 종료 */
        .image-wrap /* 이미지 영역 */
        { /* 이미지 시작 */
            position: relative; /* 내부 기준 */
            aspect-ratio: 4 / 3; /* 이미지 비율 */
            overflow: hidden; /* 이미지 넘침 제거 */
            background: #202331; /* 이미지 배경 */
        } /* 이미지 종료 */
        .image-wrap img /* 카드 이미지 */
        { /* 이미지 시작 */
            width: 100%; /* 이미지 너비 */
            height: 100%; /* 이미지 높이 */
            object-fit: cover; /* 이미지 채움 */
            object-position: center 28%; /* 얼굴 위치 */
        } /* 이미지 종료 */
        .rank-badge /* 순위 표식 */
        { /* 순위 시작 */
            position: absolute; /* 이미지 위 배치 */
            top: 10px; /* 위 위치 */
            left: 10px; /* 왼쪽 위치 */
            display: inline-flex; /* 내용 폭 */
            min-width: 48px; /* 표식 너비 */
            min-height: 30px; /* 표식 높이 */
            padding: 0 9px; /* 표식 여백 */
            align-items: center; /* 세로 중앙 */
            justify-content: center; /* 가로 중앙 */
            border-radius: 9px; /* 표식 모서리 */
            background: rgba(8, 9, 13, 0.82); /* 표식 배경 */
            color: white; /* 표식 글자 */
            font-size: 12px; /* 표식 크기 */
            font-weight: 900; /* 표식 굵기 */
            backdrop-filter: blur(8px); /* 표식 흐림 */
        } /* 순위 종료 */
        .ranking-card:nth-child(-n + 3) .rank-badge /* 상위 표식 */
        { /* 상위 시작 */
            background: linear-gradient(135deg, #f59e0b, #ef4444); /* 상위 배경 */
        } /* 상위 종료 */
        .card-copy /* 카드 내용 */
        { /* 내용 시작 */
            padding: 14px; /* 내용 여백 */
        } /* 내용 종료 */
        .card-copy h2 /* 카드 이름 */
        { /* 이름 시작 */
            margin: 0 0 7px; /* 이름 여백 */
            overflow: hidden; /* 이름 넘침 제거 */
            font-size: 14px; /* 이름 크기 */
            line-height: 1.45; /* 이름 줄높이 */
            text-overflow: ellipsis; /* 이름 말줄임 */
            white-space: nowrap; /* 이름 한 줄 */
        } /* 이름 종료 */
        .card-copy p /* 카드 설명 */
        { /* 설명 시작 */
            margin: 0 0 10px; /* 설명 여백 */
            overflow: hidden; /* 설명 넘침 제거 */
            color: var(--muted); /* 설명 글자 */
            font-size: 12px; /* 설명 크기 */
            text-overflow: ellipsis; /* 설명 말줄임 */
            white-space: nowrap; /* 설명 한 줄 */
        } /* 설명 종료 */
        .score /* 인기도 */
        { /* 인기도 시작 */
            color: #c4b5fd; /* 인기도 글자 */
            font-size: 12px; /* 인기도 크기 */
            font-weight: 800; /* 인기도 굵기 */
        } /* 인기도 종료 */
        @media (max-width: 900px) /* 태블릿 화면 */
        { /* 태블릿 시작 */
            .intro /* 태블릿 소개 */
            { /* 소개 시작 */
                align-items: stretch; /* 폭 채움 */
                flex-direction: column; /* 세로 배치 */
            } /* 소개 종료 */
        } /* 태블릿 종료 */
        @media (max-width: 760px) /* 모바일 화면 */
        { /* 모바일 시작 */
            .ranking-header /* 모바일 상단 */
            { /* 상단 시작 */
                min-height: 60px; /* 상단 높이 */
                padding: 0 12px; /* 상단 여백 */
                gap: 10px; /* 요소 간격 */
            } /* 상단 종료 */
            .brand /* 모바일 브랜드 */
            { /* 브랜드 시작 */
                font-size: 14px; /* 브랜드 크기 */
            } /* 브랜드 종료 */
            .back-link /* 모바일 뒤로 */
            { /* 뒤로 시작 */
                min-height: 36px; /* 뒤로 높이 */
                padding: 0 10px; /* 뒤로 여백 */
            } /* 뒤로 종료 */
            .count-badge /* 모바일 표식 */
            { /* 표식 시작 */
                padding: 6px 8px; /* 표식 여백 */
            } /* 표식 종료 */
            .ranking-main /* 모바일 주요 */
            { /* 주요 시작 */
                padding: 30px 12px 48px; /* 주요 여백 */
            } /* 주요 종료 */
            .ranking-grid /* 모바일 목록 */
            { /* 목록 시작 */
                grid-template-columns: repeat(2, minmax(0, 1fr)); /* 두 열 배치 */
                gap: 10px; /* 카드 간격 */
            } /* 목록 종료 */
            .image-wrap /* 모바일 이미지 */
            { /* 이미지 시작 */
                aspect-ratio: 3 / 4; /* 세로 이미지 */
            } /* 이미지 종료 */
            .card-copy /* 모바일 내용 */
            { /* 내용 시작 */
                padding: 11px; /* 내용 여백 */
            } /* 내용 종료 */
        } /* 모바일 종료 */
    </style> <!-- 화면 스타일 종료 -->
</head> <!-- 문서 정보 종료 -->
<body> <!-- 본문 -->
    <header class="ranking-header"> <!-- 상단 영역 -->
        <a class="back-link" href="./Main.html">← 홈</a> <!-- 홈 링크 -->
        <strong class="brand">MATE:VERSE</strong> <!-- 브랜드 -->
        <span class="count-badge">TOP 100</span> <!-- 순위 개수 -->
    </header> <!-- 상단 영역 종료 -->
    <main class="ranking-main"> <!-- 주요 영역 -->
        <section class="intro" aria-labelledby="ranking-title"> <!-- 소개 영역 -->
            <div class="intro-copy"> <!-- 소개 내용 -->
                <span>실시간 인기 캐릭터</span> <!-- 소개 표식 -->
                <h1 id="ranking-title">월간 추천 순위</h1> <!-- 소개 제목 -->
                <p id="ranking-description">최근 한 달 동안 가장 많은 대화가 이어진 작품 1위부터 100위입니다.</p> <!-- 소개 설명 -->
            </div> <!-- 소개 내용 종료 -->
            <nav class="period-tabs" aria-label="순위 기간 선택"> <!-- 기간 탭 -->
                <a class="period-tab" data-period="monthly" href="./Ranking.html?period=monthly">월간</a> <!-- 월간 탭 -->
                <a class="period-tab" data-period="weekly" href="./Ranking.html?period=weekly">주간</a> <!-- 주간 탭 -->
                <a class="period-tab" data-period="daily" href="./Ranking.html?period=daily">일간</a> <!-- 일간 탭 -->
            </nav> <!-- 기간 탭 종료 -->
        </section> <!-- 소개 영역 종료 -->
        <section id="ranking-grid" class="ranking-grid" aria-live="polite" aria-label="1위부터 100위까지 순위 목록"></section> <!-- 순위 목록 -->
    </main> <!-- 주요 영역 종료 -->
    <script src="./ranking-data.js"></script> <!-- 순위 데이터 불러오기 -->
    <script> // 순위 화면 동작
        const { createRankingEntries, normalizeRankingPeriod, rankingPeriodLabels } = globalThis.RankingData; // 순위 도구 연결
        const periodDescriptions = // 기간 설명
        { // 설명 시작
            monthly: "최근 한 달 동안 가장 많은 대화가 이어진 작품 1위부터 100위입니다.", // 월간 설명
            weekly: "최근 일주일 동안 빠르게 사랑받은 작품 1위부터 100위입니다.", // 주간 설명
            daily: "오늘 가장 활발하게 대화가 이어진 작품 1위부터 100위입니다.", // 일간 설명
        }; // 설명 종료
        const searchParams = new URLSearchParams(window.location.search); // 주소 매개변수 읽기
        const period = normalizeRankingPeriod(searchParams.get("period")); // 기간 보정
        const rankingTitle = document.getElementById("ranking-title"); // 제목 탐색
        const rankingDescription = document.getElementById("ranking-description"); // 설명 탐색
        const rankingGrid = document.getElementById("ranking-grid"); // 목록 탐색

        function createTextElement(tagName, className, text) // 글자 요소 생성기
        { // 함수 시작
            const element = document.createElement(tagName); // 요소 생성
            element.className = className; // 클래스 적용
            element.textContent = text; // 글자 적용
            return element; // 요소 반환
        } // 함수 종료

        function createRankingCard(entry) // 순위 카드 생성기
        { // 함수 시작
            const article = document.createElement("article"); // 카드 생성
            const imageWrap = document.createElement("div"); // 이미지 영역 생성
            const image = document.createElement("img"); // 이미지 생성
            const rankBadge = createTextElement("span", "rank-badge", `${entry.rank}위`); // 순위 표식 생성
            const cardCopy = document.createElement("div"); // 내용 영역 생성
            const title = createTextElement("h2", "", entry.name); // 이름 생성
            const description = createTextElement("p", "", entry.description); // 설명 생성
            const score = createTextElement("span", "score", `● ${entry.score} 대화`); // 인기도 생성
            article.className = "ranking-card"; // 카드 클래스 적용
            imageWrap.className = "image-wrap"; // 이미지 클래스 적용
            cardCopy.className = "card-copy"; // 내용 클래스 적용
            image.src = entry.image; // 이미지 경로 적용
            image.alt = entry.name; // 이미지 설명 적용
            image.loading = "lazy"; // 지연 로딩 적용
            imageWrap.append(image, rankBadge); // 이미지 영역 조립
            cardCopy.append(title, description, score); // 내용 영역 조립
            article.append(imageWrap, cardCopy); // 카드 조립
            return article; // 카드 반환
        } // 함수 종료

        function renderRanking() // 순위 화면 생성기
        { // 함수 시작
            const entries = createRankingEntries(period); // 순위 목록 생성
            const fragment = document.createDocumentFragment(); // 임시 묶음 생성
            rankingTitle.textContent = `${rankingPeriodLabels[period]} 순위`; // 제목 적용
            rankingDescription.textContent = periodDescriptions[period]; // 설명 적용
            document.title = `MATE:VERSE ${rankingPeriodLabels[period]} 순위`; // 문서 제목 적용
            document.querySelectorAll("[data-period]").forEach((tab) => // 기간 탭 순회
            { // 순회 시작
                const isActive = tab.dataset.period === period; // 선택 상태 계산
                tab.classList.toggle("active", isActive); // 선택 클래스 적용
                tab.setAttribute("aria-current", isActive ? "page" : "false"); // 현재 탭 표시
            }); // 순회 종료
            entries.forEach((entry) => // 순위 항목 순회
            { // 순회 시작
                fragment.append(createRankingCard(entry)); // 카드 묶음 추가
            }); // 순회 종료
            rankingGrid.replaceChildren(fragment); // 순위 목록 적용
        } // 함수 종료

        renderRanking(); // 첫 순위 화면 생성
    </script> <!-- 순위 화면 동작 종료 -->
</body> <!-- 본문 종료 -->
</html> <!-- 문서 종료 -->
